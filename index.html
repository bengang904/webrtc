<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>WebRTCMeeting</title>
<style>
:root{--discord-bg:#313338;--discord-sidebar:#2b2d31;--discord-panel:#111214;--discord-chat:#383a40;--discord-input:#383a40;--discord-text:#dbdee1;--discord-text-muted:#949ba4;--discord-accent:#5865f2;--discord-accent-hover:#4752c4;--discord-green:#23a55a;--discord-red:#f23f43;--discord-border:#1f2023}
*{box-sizing:border-box}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--discord-sidebar)}
::-webkit-scrollbar-thumb{background:#1a1b1e;border-radius:3px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--discord-bg);color:var(--discord-text);margin:0;padding:0;display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;overflow:hidden}
.app-layout{display:flex;flex-direction:column;width:100vw;height:100vh;height:100dvh;background:var(--discord-panel);overflow:hidden;position:relative}
@media(min-width:1024px){.app-layout{max-width:1500px;height:94vh;border-radius:12px;border:1px solid var(--discord-border);box-shadow:0 8px 24px rgba(0,0,0,.4)}}
.app-header{height:50px;min-height:50px;background:var(--discord-sidebar);border-bottom:1px solid var(--discord-border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10}
.app-title{font-weight:600;font-size:.95rem;color:#f2f3f5;display:flex;align-items:center;gap:8px}
.header-actions{display:flex;align-items:center;gap:6px}
.icon-btn{background:none;border:none;color:var(--discord-text);cursor:pointer;width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.icon-btn svg{width:20px;height:20px;fill:currentColor}
.status-pill{font-size:.7rem;padding:2px 8px;background:rgba(35,165,90,.15);color:var(--discord-green);border-radius:10px;font-weight:500}
.main-workspace{display:flex;flex-direction:column;flex:1;overflow:hidden;position:relative}
@media(min-width:1024px){.main-workspace{display:grid;grid-template-columns:1fr 340px}}
.stage-area{display:flex;flex-direction:column;background:var(--discord-bg);position:relative;overflow:hidden;padding:10px;gap:10px;flex:1;min-height:0}
@media(min-width:1024px){.stage-area{padding:16px;gap:16px}}
.video-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px;flex:1;min-height:0;transition:all .3s}
@media(min-width:1024px){.video-grid{gap:12px}}
.video-box{background:var(--discord-sidebar);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--discord-border);position:relative;min-height:0;cursor:pointer;transition:transform .2s}
.video-box:hover{border-color:var(--discord-accent)}
.video-grid.focused-mode{grid-template-columns:1fr;grid-template-rows:1fr}
.video-grid.focused-mode .video-box:not(.focused){display:none}
.video-header{position:absolute;top:8px;left:8px;z-index:2;padding:3px 8px;font-size:.7rem;font-weight:500;color:#fff;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);border-radius:4px}
.video-wrapper{position:relative;width:100%;height:100%;background:#111214}
video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}
.video-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(17,18,20,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:3;color:var(--discord-text-muted);font-size:.85rem;transition:opacity .2s}
.video-overlay.hidden{display:none}
.control-bar{height:64px;min-height:64px;background:var(--discord-sidebar);border-top:1px solid var(--discord-border);display:flex;align-items:center;justify-content:center;gap:16px;padding:0 16px;border-radius:8px;transition:all .3s cubic-bezier(.4,0,.2,1)}
.control-bar.collapsed{height:0;min-height:0;padding:0;overflow:hidden;border:none;opacity:0;margin:0}
.control-btn{width:44px;height:44px;border-radius:50%;background:#4e5058;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .2s,transform .1s;color:#fff;position:relative}
.control-btn:hover{background:#6d6f78}
.control-btn:active{transform:scale(.92)}
.control-btn.active{background:var(--discord-red)}
.control-btn.active:hover{background:#d83c3f}
.control-btn svg{width:20px;height:20px;fill:currentColor}
.sidebar-panel{background:var(--discord-sidebar);border-top:1px solid var(--discord-border);display:flex;flex-direction:column;height:260px;min-height:220px;overflow-y:auto;transition:transform .3s}
@media(max-width:1023px){.sidebar-panel.mobile-hidden{display:none}}
@media(min-width:1024px){.sidebar-panel{border-top:none;border-left:1px solid var(--discord-border);height:100%;overflow-y:auto}}
.panel-section{padding:14px 16px;border-bottom:1px solid var(--discord-border)}
.panel-title{font-size:.75rem;font-weight:700;color:var(--discord-text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.chat-section{flex:1;display:flex;flex-direction:column;padding:14px 16px;min-height:160px}
.chat-messages{flex:1;background:var(--discord-bg);border-radius:8px;padding:10px;overflow-y:auto;font-size:.8rem;display:flex;flex-direction:column;gap:6px;margin-bottom:8px;min-height:90px}
.chat-msg{word-break:break-all;line-height:1.4}
.chat-msg.local{color:#5865f2}
.chat-msg.remote{color:var(--discord-text)}
.chat-input-row{display:flex;gap:8px;align-items:center}
.chat-input-row input[type="text"]{flex:1;background:var(--discord-input);border:none;border-radius:6px;padding:8px 12px;color:#fff;font-size:.85rem;outline:none}
.log-box{background:var(--discord-bg);border-radius:6px;padding:8px;height:64px;overflow-y:auto;font-family:monospace;font-size:.7rem;color:#b5bac1}
.modal-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);display:flex;justify-content:center;align-items:center;z-index:1000}
.modal-card{background:var(--discord-sidebar);border:1px solid var(--discord-border);border-radius:12px;padding:24px;width:90%;max-width:480px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 32px rgba(0,0,0,.5);max-height:90vh;overflow-y:auto}
.modal-title{font-size:1.1rem;font-weight:600;color:#fff;text-align:center}
.role-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.role-pill{background:var(--discord-bg);border:1px solid transparent;border-radius:6px;padding:10px;color:var(--discord-text-muted);font-size:.85rem;font-weight:500;text-align:center;cursor:pointer;transition:all .2s}
.role-pill.active{background:rgba(88,101,242,.15);border-color:var(--discord-accent);color:#fff}
textarea,.sig-input,select.mode-select{width:100%;background:var(--discord-bg);border:1px solid transparent;border-radius:6px;color:var(--discord-text);font-family:monospace;font-size:.75rem;padding:8px;outline:none;margin-top:4px}
textarea{height:65px;resize:vertical}
.sig-input,select.mode-select{height:36px}
textarea:focus,.sig-input:focus,select.mode-select:focus{border-color:var(--discord-accent)}
select.mode-select{font-family:inherit;font-size:.85rem;cursor:pointer}
.discord-btn{background:var(--discord-accent);color:#fff;border:none;border-radius:6px;padding:9px 14px;font-size:.85rem;font-weight:500;cursor:pointer;width:100%;transition:background .2s}
.discord-btn:hover{background:var(--discord-accent-hover)}
.discord-btn:disabled{background:#4e5058;color:var(--discord-text-muted);cursor:not-allowed}
.discord-btn-secondary{background:#4e5058;color:#fff}
.discord-btn-secondary:hover{background:#6d6f78}
.step-hidden{display:none}
.waiting-box{text-align:center;padding:16px;background:rgba(88,101,242,.12);border-radius:8px;margin-top:8px}
.waiting-box .room-show{font-size:1.5rem;font-weight:700;letter-spacing:3px;color:#fff;margin:8px 0}
.waiting-box .tip{font-size:.85rem;color:var(--discord-text-muted)}
.waiting-box .spinner{display:inline-block;width:18px;height:18px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.file-msg{background:rgba(88,101,242,.12);border-radius:8px;padding:10px 12px;margin:4px 0;border:1px solid rgba(88,101,242,.25)}
.file-msg .file-name{font-weight:600;color:#fff;margin-bottom:4px;word-break:break-all}
.file-msg .file-meta{font-size:.75rem;color:var(--discord-text-muted);margin-bottom:6px}
.progress-bar-wrap{height:6px;background:#1a1b1e;border-radius:3px;overflow:hidden;margin:6px 0}
.progress-bar{height:100%;background:var(--discord-accent);width:0%;transition:width .15s ease}
.file-msg .download-btn{display:inline-block;margin-top:6px;padding:4px 10px;background:var(--discord-accent);color:#fff;border-radius:4px;font-size:.75rem;cursor:pointer;text-decoration:none}
.file-msg .download-btn:hover{background:var(--discord-accent-hover)}
.file-msg .cancel-btn{display:inline-block;margin-top:6px;margin-left:8px;padding:4px 10px;background:#4e5058;color:#fff;border-radius:4px;font-size:.75rem;cursor:pointer;border:none}
.file-msg .cancel-btn:hover{background:#6d6f78}
.file-msg.local .file-name{color:#a5b4fc}
.file-msg.remote .file-name{color:#fff}
</style>
</head>
<body>
<div class="modal-overlay" id="initModal">
<div class="modal-card">
<div class="modal-title">WebRTC P2P 连接向导</div>
<div class="panel-title">连接模式</div>
<select class="mode-select" id="connMode">
<option value="signaling">使用信令服务器</option>
<option value="manual">手动交换 SDP</option>
</select>
<div class="role-selector" style="margin-top:8px">
<div class="role-pill" id="modalHostBtn">创建方 (Offer)</div>
<div class="role-pill active" id="modalJoinBtn">加入方 (Answer)</div>
</div>
<div id="signalingSection">
<div class="panel-title" style="margin-top:6px">信令服务器地址 (ws:// 或 wss://)</div>
<input class="sig-input" id="signalingUrl" placeholder="ws://localhost:8080 或 wss://your-server.com">
<div class="panel-title" style="margin-top:10px" id="roomLabel">输入房间号</div>
<input class="sig-input" id="roomInput" placeholder="自己定义或填写对方房间号" maxlength="16">
<button class="discord-btn" id="sigConnectBtn" style="margin-top:12px">连接信令并开始</button>
<div id="waitingArea" class="step-hidden">
<div class="waiting-box">
<div><span class="spinner"></span>正在等待对方加入...</div>
<div class="room-show" id="waitingRoomCode">----</div>
<div class="tip">请把房间号发给对方，对方加入后将自动进入会议</div>
</div>
</div>
</div>
<div id="manualSection" class="step-hidden">
<div id="modalHostSection" class="step-hidden">
<div class="panel-title" style="margin-top:6px">1. 复制本端 Offer 发给对方</div>
<textarea id="modalHostSdp" placeholder="生成中..." readonly></textarea>
<button class="discord-btn discord-btn-secondary" id="modalCopyHost" style="margin-top:6px">复制 Offer</button>
<div class="panel-title" style="margin-top:10px">2. 粘贴对方的 Answer 并建立连接</div>
<textarea id="modalHostAnswer" placeholder="在此粘贴 Answer..."></textarea>
<button class="discord-btn" id="modalApplyAnswer" style="margin-top:6px" disabled>验证并进入会议</button>
</div>
<div id="modalJoinSection">
<div class="panel-title" style="margin-top:6px">1. 粘贴对方的 Offer</div>
<textarea id="modalJoinOffer" placeholder="在此粘贴 Offer..."></textarea>
<button class="discord-btn" id="modalApplyOffer" style="margin-top:6px" disabled>生成 Answer</button>
<div class="panel-title" style="margin-top:10px">2. 复制生成的 Answer 发回给对方</div>
<textarea id="modalJoinAnswer" placeholder="等待生成..." readonly></textarea>
<button class="discord-btn discord-btn-secondary" id="modalCopyJoin" style="margin-top:6px" disabled>复制 Answer</button>
<button class="discord-btn" id="modalFinishJoin" style="margin-top:8px" disabled>确认连通并进入会议</button>
</div>
</div>
</div>
</div>
<div class="app-layout">
<div class="app-header">
<div class="app-title">
<span>WebRTC Meeting</span>
<div class="status-pill" id="status">就绪</div>
</div>
<div class="header-actions">
<button class="icon-btn" id="toggleControlsBtn" title="折叠/展开控件">
<svg viewBox="0 0 24 24"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
</button>
<button class="icon-btn" id="toggleSidebarBtn" title="菜单与聊天">
<svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
</button>
</div>
</div>
<div class="main-workspace">
<div class="stage-area">
<div class="video-grid" id="videoGrid">
<div class="video-box" data-target="cam">
<div class="video-header">本地摄像头</div>
<div class="video-wrapper">
<video id="localCamVideo" autoplay muted playsinline></video>
<div class="video-overlay" id="localCamOverlay">摄像头已关闭</div>
</div>
</div>
<div class="video-box" data-target="screen">
<div class="video-header">本地屏幕</div>
<div class="video-wrapper">
<video id="localScreenVideo" autoplay muted playsinline></video>
<div class="video-overlay" id="localScreenOverlay">屏幕未共享</div>
</div>
</div>
<div class="video-box" data-target="rcam">
<div class="video-header">远端摄像头</div>
<div class="video-wrapper">
<video id="remoteCamVideo" autoplay playsinline></video>
<div class="video-overlay" id="remoteCamOverlay">对方摄像头已关闭</div>
</div>
</div>
<div class="video-box" data-target="rscreen">
<div class="video-header">远端屏幕</div>
<div class="video-wrapper">
<video id="remoteScreenVideo" autoplay playsinline></video>
<div class="video-overlay" id="remoteScreenOverlay">对方屏幕未共享</div>
</div>
</div>
</div>
<div class="control-bar" id="controlBar">
<button class="control-btn" id="micBtn" title="麦克风">
<svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
</button>
<button class="control-btn active" id="soundBtn" title="扬声器">
<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
</button>
<button class="control-btn" id="camBtn" title="摄像头">
<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-3.5v-3.5l4 4v-11l-4 4z"/><circle cx="10" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="10" cy="12" r="1" fill="currentColor"/></svg>
</button>
<button class="control-btn" id="screenBtn" title="屏幕共享">
<svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
</button>
</div>
</div>
<div class="sidebar-panel mobile-hidden" id="sidebarPanel">
<div class="chat-section">
<div class="panel-title">文字聊天</div>
<div class="chat-messages" id="chatMessages">
<div style="color:var(--discord-text-muted);text-align:center">连接后聊天</div>
</div>
<div class="chat-input-row">
<input type="file" id="fileInput" style="display:none">
<button class="discord-btn" id="fileBtn" disabled style="width:auto;padding:0 10px;font-size:1rem" title="发送文件">📎</button>
<input type="text" id="chatInput" placeholder="发消息..." disabled>
<button class="discord-btn" id="sendChatBtn" disabled style="width:auto;padding:0 12px">发送</button>
</div>
</div>
<div class="panel-section" style="padding-bottom:14px">
<div class="panel-title" style="margin-bottom:4px">日志</div>
<div class="log-box" id="log">准备就绪...</div>
</div>
</div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
const statusEl=$('status'),initModal=$('initModal'),modalHostBtn=$('modalHostBtn'),modalJoinBtn=$('modalJoinBtn'),
modalHostSection=$('modalHostSection'),modalJoinSection=$('modalJoinSection'),modalHostSdp=$('modalHostSdp'),
modalCopyHost=$('modalCopyHost'),modalHostAnswer=$('modalHostAnswer'),modalApplyAnswer=$('modalApplyAnswer'),
modalJoinOffer=$('modalJoinOffer'),modalApplyOffer=$('modalApplyOffer'),modalJoinAnswer=$('modalJoinAnswer'),
modalCopyJoin=$('modalCopyJoin'),modalFinishJoin=$('modalFinishJoin'),micBtn=$('micBtn'),soundBtn=$('soundBtn'),
camBtn=$('camBtn'),screenBtn=$('screenBtn'),chatMessages=$('chatMessages'),chatInput=$('chatInput'),
sendChatBtn=$('sendChatBtn'),localCamVideo=$('localCamVideo'),localScreenVideo=$('localScreenVideo'),
remoteCamVideo=$('remoteCamVideo'),remoteScreenVideo=$('remoteScreenVideo'),localCamOverlay=$('localCamOverlay'),
localScreenOverlay=$('localScreenOverlay'),remoteCamOverlay=$('remoteCamOverlay'),remoteScreenOverlay=$('remoteScreenOverlay'),
logEl=$('log'),toggleControlsBtn=$('toggleControlsBtn'),controlBar=$('controlBar'),toggleSidebarBtn=$('toggleSidebarBtn'),
sidebarPanel=$('sidebarPanel'),videoGrid=$('videoGrid'),connMode=$('connMode'),signalingSection=$('signalingSection'),
manualSection=$('manualSection'),signalingUrl=$('signalingUrl'),sigConnectBtn=$('sigConnectBtn'),roomInput=$('roomInput'),
roomLabel=$('roomLabel'),waitingArea=$('waitingArea'),waitingRoomCode=$('waitingRoomCode'),
fileInput=$('fileInput'),fileBtn=$('fileBtn');
let pc,dataChannel,ws,role='join',currentRoom='',micEnabled=false,soundEnabled=true,camEnabled=false,screenEnabled=false,
micTrack=null,camTrack=null,screenTrack=null,screenAudioTrack=null,audioTransceiver=null,videoTransceiver1=null,videoTransceiver2=null,
remoteVideoCount=0,controlsExpanded=true,offerHandled=false,returningToWizard=false;
const ICE_SERVERS={iceServers:[{urls:'stun:stun.l.google.com:19302'}]},STORAGE_KEY='webrtc_signaling_url';
const CHUNK_SIZE=16*1024;
const BUFFER_THRESHOLD=256*1024;
const pendingFiles=new Map();
const activeSends=new Map();
function log(m){console.log(m);logEl.innerHTML+=`<div>[${new Date().toLocaleTimeString()}] ${m}</div>`;logEl.scrollTop=logEl.scrollHeight}
function loadSavedUrl(){const s=localStorage.getItem(STORAGE_KEY);if(s)signalingUrl.value=s}
function saveUrl(){const u=signalingUrl.value.trim();if(u)localStorage.setItem(STORAGE_KEY,u)}
function updateModeUI(){const isSig=connMode.value==='signaling';signalingSection.classList.toggle('step-hidden',!isSig);manualSection.classList.toggle('step-hidden',isSig);updateRoleUI();resetPeer()}
function updateRoleUI(){if(connMode.value!=='signaling'){role==='host'?(modalHostSection.classList.remove('step-hidden'),modalJoinSection.classList.add('step-hidden')):(modalJoinSection.classList.remove('step-hidden'),modalHostSection.classList.add('step-hidden'));return}roomLabel.textContent=role==='host'?'自定义房间号（创建）':'输入创建方的房间号（加入）';roomInput.placeholder=role==='host'?'自己输入房间号，例如 myroom01':'填写对方创建的房间号';waitingArea.classList.add('step-hidden');sigConnectBtn.disabled=false;sigConnectBtn.textContent='连接信令并开始'}
connMode.addEventListener('change',updateModeUI);
signalingUrl.addEventListener('change',saveUrl);signalingUrl.addEventListener('blur',saveUrl);
modalHostBtn.addEventListener('click',()=>{modalHostBtn.classList.add('active');modalJoinBtn.classList.remove('active');role='host';resetPeer();updateRoleUI();if(connMode.value==='manual'){modalHostSection.classList.remove('step-hidden');modalJoinSection.classList.add('step-hidden');initHostPeer()}});
modalJoinBtn.addEventListener('click',()=>{modalJoinBtn.classList.add('active');modalHostBtn.classList.remove('active');role='join';resetPeer();updateRoleUI();if(connMode.value==='manual'){modalJoinSection.classList.remove('step-hidden');modalHostSection.classList.add('step-hidden');initJoinPeer()}});
function stopAllTracks(){if(micTrack){micTrack.stop();micTrack=null}if(camTrack){camTrack.stop();camTrack=null}if(screenTrack){screenTrack.stop();screenTrack=null}if(screenAudioTrack){screenAudioTrack.stop();screenAudioTrack=null}micEnabled=false;camEnabled=false;screenEnabled=false;micBtn.classList.remove('active');camBtn.classList.remove('active');screenBtn.classList.remove('active');localCamVideo.srcObject=null;localScreenVideo.srcObject=null;remoteCamVideo.srcObject=null;remoteScreenVideo.srcObject=null;localCamOverlay.classList.remove('hidden');localCamOverlay.textContent='摄像头已关闭';localScreenOverlay.classList.remove('hidden');localScreenOverlay.textContent='屏幕未共享';remoteCamOverlay.classList.remove('hidden');remoteCamOverlay.textContent='对方摄像头已关闭';remoteScreenOverlay.classList.remove('hidden');remoteScreenOverlay.textContent='对方屏幕未共享';const a=document.getElementById('remoteAudioElem');if(a){a.srcObject=null;a.remove()}}
function returnToWizard(){if(returningToWizard)return;returningToWizard=true;log('对方已离开或连接断开，返回连接向导');stopAllTracks();if(pc){try{pc.close()}catch{}pc=null}if(ws){try{ws.close()}catch{}ws=null}dataChannel=null;audioTransceiver=videoTransceiver1=videoTransceiver2=null;remoteVideoCount=0;chatInput.disabled=true;sendChatBtn.disabled=true;fileBtn.disabled=true;chatMessages.innerHTML='<div style="color:var(--discord-text-muted);text-align:center">连接后聊天</div>';statusEl.textContent='就绪';pendingFiles.clear();activeSends.clear();offerHandled=false;currentRoom='';waitingArea.classList.add('step-hidden');sigConnectBtn.disabled=false;sigConnectBtn.textContent='连接信令并开始';modalHostSdp.value=modalJoinAnswer.value='';modalCopyJoin.disabled=modalFinishJoin.disabled=modalApplyAnswer.disabled=true;modalApplyOffer.disabled=true;initModal.style.display='flex';setTimeout(()=>{returningToWizard=false},500)}
function resetPeer(){if(pc){pc.close();pc=null}if(ws){ws.close();ws=null}dataChannel=null;audioTransceiver=videoTransceiver1=videoTransceiver2=null;remoteVideoCount=0;modalHostSdp.value=modalJoinAnswer.value='';modalCopyJoin.disabled=modalFinishJoin.disabled=modalApplyAnswer.disabled=true;modalApplyOffer.disabled=modalJoinOffer.value.trim().length<=10;currentRoom='';offerHandled=false;waitingArea.classList.add('step-hidden');sigConnectBtn.disabled=false;sigConnectBtn.textContent='连接信令并开始';pendingFiles.clear();activeSends.clear()}
document.querySelectorAll('.video-box').forEach(b=>b.addEventListener('click',()=>{if(b.classList.contains('focused')){videoGrid.classList.remove('focused-mode');b.classList.remove('focused')}else{document.querySelectorAll('.video-box').forEach(x=>x.classList.remove('focused'));videoGrid.classList.add('focused-mode');b.classList.add('focused')}}));

micBtn.addEventListener('click',async()=>{micEnabled=!micEnabled;if(micEnabled){try{const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});micTrack=s.getAudioTracks()[0];if(audioTransceiver)await audioTransceiver.sender.replaceTrack(micTrack);micBtn.classList.add('active');log('麦克风已开启')}catch(e){micEnabled=false;micBtn.classList.remove('active');log('麦克风获取失败: '+e.message)}}else{if(micTrack){micTrack.stop();if(audioTransceiver)await audioTransceiver.sender.replaceTrack(null);micTrack=null}micBtn.classList.remove('active');log('麦克风已关闭')}});
soundBtn.addEventListener('click',()=>{soundEnabled=!soundEnabled;remoteCamVideo.muted=!soundEnabled;remoteScreenVideo.muted=!soundEnabled;const a=document.getElementById('remoteAudioElem');if(a)a.muted=!soundEnabled;soundEnabled?(soundBtn.classList.add('active'),log('扬声器已开启')):(soundBtn.classList.remove('active'),log('扬声器已静音'))});
camBtn.addEventListener('click',async()=>{camEnabled=!camEnabled;if(camEnabled){try{const s=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480}}});camTrack=s.getVideoTracks()[0];localCamVideo.srcObject=new MediaStream([camTrack]);localCamOverlay.classList.add('hidden');if(videoTransceiver1)await videoTransceiver1.sender.replaceTrack(camTrack);camBtn.classList.add('active');log('摄像头已开启');sendControlMessage({type:'video-state',target:'cam',enabled:true})}catch(e){camEnabled=false;camBtn.classList.remove('active');localCamOverlay.textContent='摄像头获取失败';localCamOverlay.classList.remove('hidden');log('摄像头获取失败: '+e.message)}}else{if(camTrack){camTrack.stop();if(videoTransceiver1)await videoTransceiver1.sender.replaceTrack(null);camTrack=null}localCamVideo.srcObject=null;localCamOverlay.textContent='摄像头已关闭';localCamOverlay.classList.remove('hidden');camBtn.classList.remove('active');log('摄像头已关闭');sendControlMessage({type:'video-state',target:'cam',enabled:false})}});
screenBtn.addEventListener('click',async()=>{if(!navigator.mediaDevices.getDisplayMedia){alert('当前浏览器或手机系统不支持屏幕共享功能');return}screenEnabled=!screenEnabled;if(screenEnabled){try{const s=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});screenTrack=s.getVideoTracks()[0];screenTrack.onended=()=>{if(screenEnabled)screenBtn.click()};localScreenVideo.srcObject=new MediaStream([screenTrack]);localScreenOverlay.classList.add('hidden');if(videoTransceiver2)await videoTransceiver2.sender.replaceTrack(screenTrack);const audioTracks=s.getAudioTracks();if(audioTracks.length>0){screenAudioTrack=audioTracks[0];if(audioTransceiver)await audioTransceiver.sender.replaceTrack(screenAudioTrack);log('屏幕共享已开启（含系统声音）')}else{screenAudioTrack=null;log('屏幕共享已开启（无系统声音）')}screenBtn.classList.add('active');sendControlMessage({type:'video-state',target:'screen',enabled:true})}catch(e){screenEnabled=false;screenBtn.classList.remove('active');localScreenOverlay.textContent='屏幕共享未开启/不支持';localScreenOverlay.classList.remove('hidden');log('屏幕共享已取消或被拒绝: '+e.message)}}else{if(screenTrack){screenTrack.stop();if(videoTransceiver2)await videoTransceiver2.sender.replaceTrack(null);screenTrack=null}if(screenAudioTrack){screenAudioTrack.stop();screenAudioTrack=null;if(audioTransceiver){if(micEnabled&&micTrack)await audioTransceiver.sender.replaceTrack(micTrack);else await audioTransceiver.sender.replaceTrack(null)}}localScreenVideo.srcObject=null;localScreenOverlay.textContent='屏幕共享未开启';localScreenOverlay.classList.remove('hidden');screenBtn.classList.remove('active');log('屏幕共享已关闭');sendControlMessage({type:'video-state',target:'screen',enabled:false})}});
function sendControlMessage(o){if(dataChannel&&dataChannel.readyState==='open')dataChannel.send(JSON.stringify(o))}

function formatSize(bytes){if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return(bytes/1024).toFixed(1)+' KB';return(bytes/(1024*1024)).toFixed(2)+' MB'}
function createFileMsgEl(meta,isLocal){const wrap=document.createElement('div');wrap.className=`file-msg ${isLocal?'local':'remote'}`;wrap.innerHTML=`<div class="file-name">${isLocal?'我发送: ':'对方发送: '}${meta.name}</div><div class="file-meta">${formatSize(meta.size)} · ${meta.mime||'未知类型'}</div><div class="progress-bar-wrap"><div class="progress-bar" style="width:0%"></div></div><div class="status-text" style="font-size:.75rem;color:var(--discord-text-muted)">准备传输...</div>`;chatMessages.appendChild(wrap);chatMessages.scrollTop=chatMessages.scrollHeight;return{el:wrap,progressBar:wrap.querySelector('.progress-bar'),statusText:wrap.querySelector('.status-text')}}
function handleFileMeta(meta){const id=meta.id;const ui=createFileMsgEl(meta,false);pendingFiles.set(id,{meta,chunks:[],received:0,total:meta.totalChunks,ui});ui.statusText.textContent=`接收中 0%`;log(`开始接收文件: ${meta.name} (${formatSize(meta.size)})`)}
function processChunkData(id,data){const entry=pendingFiles.get(id);if(!entry)return;entry.chunks.push(data);entry.received++;const pct=Math.min(100,Math.round(entry.received/entry.total*100));entry.ui.progressBar.style.width=pct+'%';entry.ui.statusText.textContent=`接收中 ${pct}% (${entry.received}/${entry.total})`;if(entry.received>=entry.total)finishReceiveFile(id)}
function handleFileChunk(raw){const process=buffer=>{const view=new Uint8Array(buffer);if(view.length<36)return;const id=String.fromCharCode.apply(null,view.subarray(0,36));const data=view.subarray(36);processChunkData(id,data)};if(raw instanceof Blob){raw.arrayBuffer().then(process).catch(err=>log('文件分片解析失败: '+err.message))}else if(raw instanceof ArrayBuffer){process(raw)}else if(raw instanceof Uint8Array){process(raw.buffer)}}
function finishReceiveFile(id){const entry=pendingFiles.get(id);if(!entry)return;const{meta,chunks,ui}=entry;const totalLen=chunks.reduce((s,c)=>s+c.length,0);const result=new Uint8Array(totalLen);let offset=0;for(const c of chunks){result.set(c,offset);offset+=c.length}const blob=new Blob([result],{type:meta.mime||'application/octet-stream'});const url=URL.createObjectURL(blob);ui.progressBar.style.width='100%';ui.statusText.innerHTML=`接收完成 · <a class="download-btn" href="${url}" download="${meta.name}">下载文件</a>`;log(`文件接收完成: ${meta.name}`);pendingFiles.delete(id)}
function cancelReceiveFile(id){const entry=pendingFiles.get(id);if(!entry)return;entry.ui.progressBar.style.width='0%';entry.ui.statusText.textContent='对方已取消发送';pendingFiles.delete(id);log(`文件接收已取消: ${entry.meta.name}`)}
async function sendFile(file){if(!dataChannel||dataChannel.readyState!=='open'){alert('聊天通道未就绪');return}const id=crypto.randomUUID();const totalChunks=Math.ceil(file.size/CHUNK_SIZE)||1;const meta={type:'file-meta',id,name:file.name,size:file.size,mime:file.type||'application/octet-stream',totalChunks};dataChannel.send(JSON.stringify(meta));const ui=createFileMsgEl(meta,true);ui.statusText.textContent='发送中 0%';const cancelBtn=document.createElement('button');cancelBtn.className='cancel-btn';cancelBtn.textContent='取消';ui.statusText.parentNode.appendChild(cancelBtn);let cancelled=false;activeSends.set(id,{cancelled:false});cancelBtn.onclick=()=>{cancelled=true;activeSends.get(id).cancelled=true;dataChannel.send(JSON.stringify({type:'file-cancel',id}));ui.progressBar.style.width='0%';ui.statusText.textContent='已取消';cancelBtn.remove();log(`文件发送已取消: ${file.name}`);activeSends.delete(id)};dataChannel.bufferedAmountLowThreshold=BUFFER_THRESHOLD;const buffer=await file.arrayBuffer();const u8=new Uint8Array(buffer);let sent=0;for(let i=0;i<totalChunks;i++){if(cancelled||(activeSends.get(id)&&activeSends.get(id).cancelled))break;while(dataChannel.bufferedAmount>BUFFER_THRESHOLD){if(cancelled||(activeSends.get(id)&&activeSends.get(id).cancelled))break;await new Promise(resolve=>{const handler=()=>{dataChannel.removeEventListener('bufferedamountlow',handler);resolve()};dataChannel.addEventListener('bufferedamountlow',handler)})}if(cancelled||(activeSends.get(id)&&activeSends.get(id).cancelled))break;const start=i*CHUNK_SIZE;const end=Math.min(start+CHUNK_SIZE,u8.length);const chunkData=u8.subarray(start,end);const packet=new Uint8Array(36+chunkData.length);for(let j=0;j<36;j++)packet[j]=id.charCodeAt(j);packet.set(chunkData,36);try{dataChannel.send(packet)}catch(e){log('发送分片失败: '+e.message);ui.statusText.textContent='发送失败';cancelBtn.remove();activeSends.delete(id);return}sent++;const pct=Math.round(sent/totalChunks*100);ui.progressBar.style.width=pct+'%';ui.statusText.textContent=`发送中 ${pct}% (${sent}/${totalChunks})`}if(!cancelled&&!(activeSends.get(id)&&activeSends.get(id).cancelled)){ui.progressBar.style.width='100%';ui.statusText.textContent='发送完成';cancelBtn.remove();log(`文件发送完成: ${file.name}`)}activeSends.delete(id)}
fileBtn.addEventListener('click',()=>{if(!fileBtn.disabled)fileInput.click()});
fileInput.addEventListener('change',()=>{const f=fileInput.files[0];if(f)sendFile(f);fileInput.value=''});
function setupDataChannelEvents(){dataChannel.binaryType='arraybuffer';dataChannel.onopen=()=>{log('聊天通道已连通');chatInput.disabled=false;sendChatBtn.disabled=false;fileBtn.disabled=false};dataChannel.onclose=()=>{log('数据通道已关闭');returnToWizard()};dataChannel.onmessage=e=>{if(e.data instanceof ArrayBuffer||e.data instanceof Blob||e.data instanceof Uint8Array){handleFileChunk(e.data);return}if(typeof e.data==='string'){try{const d=JSON.parse(e.data);if(d.type==='video-state'){if(d.target==='cam')d.enabled?remoteCamOverlay.classList.add('hidden'):(remoteCamOverlay.textContent='对方摄像头已关闭',remoteCamOverlay.classList.remove('hidden'));else if(d.target==='screen')d.enabled?remoteScreenOverlay.classList.add('hidden'):(remoteScreenOverlay.textContent='对方屏幕未共享',remoteScreenOverlay.classList.remove('hidden'));return}if(d.type==='file-meta'){handleFileMeta(d);return}if(d.type==='file-cancel'){cancelReceiveFile(d.id);return}}catch{}appendMessage(e.data,'remote')}}}
function appendMessage(t,ty){const d=document.createElement('div');d.className=`chat-msg ${ty}`;d.textContent=(ty==='local'?'我: ':'对方: ')+t;chatMessages.appendChild(d);chatMessages.scrollTop=chatMessages.scrollHeight}
sendChatBtn.addEventListener('click',()=>{const t=chatInput.value.trim();if(!t)return;if(dataChannel&&dataChannel.readyState==='open'){dataChannel.send(t);appendMessage(t,'local');chatInput.value=''}else alert('聊天通道未就绪')});
chatInput.addEventListener('keypress',e=>{if(e.key==='Enter')sendChatBtn.click()});
function handleIncomingTrack(e){log('已捕获远端媒体轨道: '+e.track.kind);statusEl.textContent='通话中';let s=e.streams[0]||new MediaStream([e.track]);if(e.track.kind==='audio'){let a=document.getElementById('remoteAudioElem');if(!a){a=document.createElement('audio');a.id='remoteAudioElem';a.autoplay=true;a.playsInline=true;a.muted=!soundEnabled;document.body.appendChild(a)}a.srcObject=s;a.play().catch(()=>{})}else if(e.track.kind==='video'){if(remoteVideoCount===0){remoteCamVideo.srcObject=s;remoteCamVideo.play().catch(()=>{});remoteCamOverlay.classList.add('hidden');remoteVideoCount++}else{remoteScreenVideo.srcObject=s;remoteScreenVideo.play().catch(()=>{});remoteScreenOverlay.classList.add('hidden')}}}
function bindConnectionState(pcRef){pcRef.onconnectionstatechange=()=>{if(pcRef.connectionState==='disconnected'||pcRef.connectionState==='failed'||pcRef.connectionState==='closed'){log('连接状态: '+pcRef.connectionState);returnToWizard()}};pcRef.oniceconnectionstatechange=()=>{if(pcRef.iceConnectionState==='disconnected'||pcRef.iceConnectionState==='failed'||pcRef.iceConnectionState==='closed'){log('ICE状态: '+pcRef.iceConnectionState);returnToWizard()}}}
function createHostPeerConnection(){pc=new RTCPeerConnection(ICE_SERVERS);bindConnectionState(pc);audioTransceiver=pc.addTransceiver('audio',{direction:'sendrecv'});videoTransceiver1=pc.addTransceiver('video',{direction:'sendrecv'});videoTransceiver2=pc.addTransceiver('video',{direction:'sendrecv'});if(micTrack&&audioTransceiver)audioTransceiver.sender.replaceTrack(micTrack).catch(()=>{});if(camTrack&&videoTransceiver1)videoTransceiver1.sender.replaceTrack(camTrack).catch(()=>{});if(screenTrack&&videoTransceiver2)videoTransceiver2.sender.replaceTrack(screenTrack).catch(()=>{});pc.ontrack=handleIncomingTrack}
function createJoinPeerConnection(){pc=new RTCPeerConnection(ICE_SERVERS);bindConnectionState(pc);pc.ontrack=handleIncomingTrack;pc.ondatachannel=e=>{dataChannel=e.channel;setupDataChannelEvents()}}
function bindJoinTransceivers(){audioTransceiver=videoTransceiver1=videoTransceiver2=null;for(const t of pc.getTransceivers()){const k=t.receiver?.track?.kind;if(k==='audio'&&!audioTransceiver)audioTransceiver=t;else if(k==='video'){if(!videoTransceiver1)videoTransceiver1=t;else if(!videoTransceiver2)videoTransceiver2=t}}[audioTransceiver,videoTransceiver1,videoTransceiver2].forEach(t=>{if(t&&t.direction!=='sendrecv')try{t.direction='sendrecv'}catch{}});if(micTrack&&audioTransceiver)audioTransceiver.sender.replaceTrack(micTrack).catch(()=>{});if(camTrack&&videoTransceiver1)videoTransceiver1.sender.replaceTrack(camTrack).catch(()=>{});if(screenTrack&&videoTransceiver2)videoTransceiver2.sender.replaceTrack(screenTrack).catch(()=>{})}
async function initHostPeer(){createHostPeerConnection();dataChannel=pc.createDataChannel('chat');setupDataChannelEvents();let g=false;pc.onicecandidate=e=>{if(!e.candidate&&!g){g=true;modalHostSdp.value=JSON.stringify(pc.localDescription);log('Host Offer 收集完成');if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'offer',room:currentRoom,sdp:pc.localDescription}))}};const o=await pc.createOffer();await pc.setLocalDescription(o);setTimeout(()=>{if(!modalHostSdp.value){modalHostSdp.value=JSON.stringify(pc.localDescription);log('Host Offer 已就绪');if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'offer',room:currentRoom,sdp:pc.localDescription}))}},1200)}
modalApplyAnswer.addEventListener('click',async()=>{try{const a=JSON.parse(modalHostAnswer.value.trim());await pc.setRemoteDescription(new RTCSessionDescription(a));log('Answer 加载成功，正在建立 P2P 直连...');initModal.style.display='none'}catch(e){alert('应用 Answer 失败: '+e.message)}});
function initJoinPeer(){createJoinPeerConnection()}
modalApplyOffer.addEventListener('click',async()=>{try{if(!pc)createJoinPeerConnection();const o=JSON.parse(modalJoinOffer.value.trim());await pc.setRemoteDescription(new RTCSessionDescription(o));bindJoinTransceivers();const a=await pc.createAnswer();await pc.setLocalDescription(a);let g=false;pc.onicecandidate=e=>{if(!e.candidate&&!g){g=true;modalJoinAnswer.value=JSON.stringify(pc.localDescription);modalCopyJoin.disabled=modalFinishJoin.disabled=false;log('Answer 收集完成，可复制发回');if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'answer',room:currentRoom,sdp:pc.localDescription}))}};setTimeout(()=>{if(!modalJoinAnswer.value){modalJoinAnswer.value=JSON.stringify(pc.localDescription);modalCopyJoin.disabled=modalFinishJoin.disabled=false;log('Answer 已就绪');if(ws&&ws.readyState===1)ws.send(JSON.stringify({type:'answer',room:currentRoom,sdp:pc.localDescription}))}},1200)}catch(e){alert('解析 Offer 失败: '+e.message)}});
modalFinishJoin.addEventListener('click',()=>{initModal.style.display='none';log('已确认连通，进入会议')});
sigConnectBtn.addEventListener('click',()=>{const url=signalingUrl.value.trim();if(!url.startsWith('ws://')&&!url.startsWith('wss://')){alert('请输入有效的 ws:// 或 wss:// 地址');return}saveUrl();const room=roomInput.value.trim();if(!room||room.length<2){alert('请输入房间号（至少2位）');return}resetPeer();currentRoom=room;offerHandled=false;sigConnectBtn.disabled=true;sigConnectBtn.textContent='连接中...';ws=new WebSocket(url);ws.onopen=()=>{log('信令服务器已连接');if(role==='host'){ws.send(JSON.stringify({type:'create',room:currentRoom}));log('正在创建房间: '+currentRoom)}else{ws.send(JSON.stringify({type:'join',room:currentRoom}));log('正在加入房间: '+currentRoom);initJoinPeer()}};ws.onmessage=async e=>{try{const m=JSON.parse(e.data);if(m.type==='error'){alert(m.message||'信令错误');sigConnectBtn.disabled=false;sigConnectBtn.textContent='连接信令并开始';return}if(m.type==='room-created'){log('房间创建成功: '+m.room);waitingRoomCode.textContent=m.room;waitingArea.classList.remove('step-hidden');sigConnectBtn.textContent='等待对方加入中...';initHostPeer()}if(m.type==='joined'){log('成功加入房间: '+m.room)}if(m.type==='offer'&&role==='join'&&!offerHandled){if(!pc)createJoinPeerConnection();if(pc.signalingState!=='stable'){log('忽略重复 Offer，当前状态: '+pc.signalingState);return}offerHandled=true;log('收到 Offer，开始生成 Answer');await pc.setRemoteDescription(new RTCSessionDescription(m.sdp));bindJoinTransceivers();const a=await pc.createAnswer();await pc.setLocalDescription(a);let g=false;pc.onicecandidate=ev=>{if(!ev.candidate&&!g){g=true;ws.send(JSON.stringify({type:'answer',room:currentRoom,sdp:pc.localDescription}));log('Answer 已通过信令发送');initModal.style.display='none';statusEl.textContent='通话中'}};setTimeout(()=>{if(pc.localDescription){ws.send(JSON.stringify({type:'answer',room:currentRoom,sdp:pc.localDescription}));initModal.style.display='none';statusEl.textContent='通话中'}},1200)}else if(m.type==='answer'&&role==='host'){if(pc.signalingState!=='have-local-offer'){log('忽略 Answer，当前状态: '+pc.signalingState);return}await pc.setRemoteDescription(new RTCSessionDescription(m.sdp));log('Answer 已通过信令接收，对方已加入，进入会议');initModal.style.display='none';statusEl.textContent='通话中'}else if(m.type==='candidate'&&pc){try{await pc.addIceCandidate(m.candidate)}catch{}}else if(m.type==='peer-left'){log('对方已离开房间');returnToWizard()}}catch(err){log('信令消息处理失败: '+err.message)}};ws.onerror=()=>{log('信令连接错误');sigConnectBtn.disabled=false;sigConnectBtn.textContent='连接信令并开始'};ws.onclose=()=>{log('信令连接已关闭');if(initModal.style.display!=='none'){sigConnectBtn.disabled=false;sigConnectBtn.textContent='连接信令并开始'}else{returnToWizard()}}});
loadSavedUrl();initJoinPeer();updateModeUI();
