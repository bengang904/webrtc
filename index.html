<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WebRTC Meeting</title>
    <style>
        :root {
            --discord-bg: #313338;
            --discord-sidebar: #2b2d31;
            --discord-panel: #111214;
            --discord-chat: #383a40;
            --discord-input: #383a40;
            --discord-text: #dbdee1;
            --discord-text-muted: #949ba4;
            --discord-accent: #5865f2;
            --discord-accent-hover: #4752c4;
            --discord-green: #23a55a;
            --discord-red: #f23f43;
            --discord-border: #1f2023;
        }

        * { box-sizing: border-box; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--discord-sidebar); }
        ::-webkit-scrollbar-thumb { background: #1a1b1e; border-radius: 3px; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--discord-bg);
            color: var(--discord-text);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }

        .app-layout {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background-color: var(--discord-panel);
            overflow: hidden;
            position: relative;
        }

        @media (min-width: 1024px) {
            .app-layout {
                max-width: 1500px;
                height: 94vh;
                border-radius: 12px;
                border: 1px solid var(--discord-border);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            }
        }

        .app-header {
            height: 50px;
            min-height: 50px;
            background-color: var(--discord-sidebar);
            border-bottom: 1px solid var(--discord-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 10;
        }

        .app-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: #f2f3f5;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--discord-text);
            cursor: pointer;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }
        .icon-btn:hover { background-color: rgba(255,255,255,0.08); }
        .icon-btn svg { width: 20px; height: 20px; fill: currentColor; }

        .status-pill {
            font-size: 0.7rem;
            padding: 2px 8px;
            background: rgba(35, 165, 90, 0.15);
            color: var(--discord-green);
            border-radius: 10px;
            font-weight: 500;
        }

        .main-workspace {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        @media (min-width: 1024px) {
            .main-workspace {
                display: grid;
                grid-template-columns: 1fr 340px;
            }
        }

        .stage-area {
            display: flex;
            flex-direction: column;
            background-color: var(--discord-bg);
            position: relative;
            overflow: hidden;
            padding: 10px;
            gap: 10px;
            flex: 1;
            min-height: 0;
        }

        @media (min-width: 1024px) {
            .stage-area {
                padding: 16px;
                gap: 16px;
            }
        }

        .video-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            flex: 1;
            min-height: 0;
            transition: all 0.3s ease;
        }

        @media (min-width: 1024px) {
            .video-grid {
                gap: 12px;
            }
        }

        .video-box {
            background-color: var(--discord-sidebar);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--discord-border);
            position: relative;
            min-height: 0;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .video-box:hover {
            border-color: var(--discord-accent);
        }

        .video-grid.focused-mode {
            grid-template-columns: 1fr;
            grid-template-rows: 1fr;
        }

        .video-grid.focused-mode .video-box:not(.focused) {
            display: none;
        }

        .video-header {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 2;
            padding: 3px 8px;
            font-size: 0.7rem;
            font-weight: 500;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border-radius: 4px;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            background: #111214;
        }

        video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: contain;
        }

        .video-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(17, 18, 20, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 3;
            color: var(--discord-text-muted);
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }
        .video-overlay.hidden { display: none; }

        .control-bar {
            height: 64px;
            min-height: 64px;
            background-color: var(--discord-sidebar);
            border-top: 1px solid var(--discord-border);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 0 16px;
            border-radius: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .control-bar.collapsed {
            height: 0;
            min-height: 0;
            padding: 0;
            overflow: hidden;
            border: none;
            opacity: 0;
            margin: 0;
        }

        .control-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: #4e5058;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            color: #fff;
            position: relative;
        }

        .control-btn:hover { background-color: #6d6f78; }
        .control-btn:active { transform: scale(0.92); }

        .control-btn.active {
            background-color: var(--discord-red);
        }
        .control-btn.active:hover { background-color: #d83c3f; }

        .control-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .sidebar-panel {
            background-color: var(--discord-sidebar);
            border-top: 1px solid var(--discord-border);
            display: flex;
            flex-direction: column;
            height: 260px;
            min-height: 220px;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }

        @media (max-width: 1023px) {
            .sidebar-panel.mobile-hidden {
                display: none;
            }
        }

        @media (min-width: 1024px) {
            .sidebar-panel {
                border-top: none;
                border-left: 1px solid var(--discord-border);
                height: 100%;
                overflow-y: auto;
            }
        }

        .panel-section {
            padding: 14px 16px;
            border-bottom: 1px solid var(--discord-border);
        }

        .panel-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--discord-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 14px 16px;
            min-height: 160px;
        }

        .chat-messages {
            flex: 1;
            background-color: var(--discord-bg);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 8px;
            min-height: 90px;
        }

        .chat-msg {
            word-break: break-all;
            line-height: 1.4;
        }
        .chat-msg.local { color: #5865f2; }
        .chat-msg.remote { color: var(--discord-text); }

        .chat-input-row {
            display: flex;
            gap: 8px;
        }

        .chat-input-row input {
            flex: 1;
            background-color: var(--discord-input);
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }

        .log-box {
            background-color: var(--discord-bg);
            border-radius: 6px;
            padding: 8px;
            height: 64px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.7rem;
            color: #b5bac1;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-card {
            background-color: var(--discord-sidebar);
            border: 1px solid var(--discord-border);
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            text-align: center;
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .role-pill {
            background-color: var(--discord-bg);
            border: 1px solid transparent;
            border-radius: 6px;
            padding: 10px;
            color: var(--discord-text-muted);
            font-size: 0.85rem;
            font-weight: 500;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .role-pill.active {
            background-color: rgba(88, 101, 242, 0.15);
            border-color: var(--discord-accent);
            color: #fff;
        }

        textarea {
            width: 100%;
            height: 65px;
            background-color: var(--discord-bg);
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--discord-text);
            font-family: monospace;
            font-size: 0.75rem;
            padding: 8px;
            resize: vertical;
            outline: none;
            margin-top: 4px;
        }
        textarea:focus { border-color: var(--discord-accent); }

        .discord-btn {
            background-color: var(--discord-accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 9px 14px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s;
        }
        .discord-btn:hover { background-color: var(--discord-accent-hover); }
        .discord-btn:disabled { background-color: #4e5058; color: var(--discord-text-muted); cursor: not-allowed; }

        .discord-btn-secondary {
            background-color: #4e5058;
            color: #fff;
        }
        .discord-btn-secondary:hover { background-color: #6d6f78; }

        .step-hidden { display: none; }
    </style>
</head>
<body>
    <div class="modal-overlay" id="initModal">
        <div class="modal-card">
            <div class="modal-title">WebRTC P2P 连接向导</div>
            <div class="role-selector">
                <div class="role-pill" id="modalHostBtn">创建方 (Offer)</div>
                <div class="role-pill active" id="modalJoinBtn">加入方 (Answer)</div>
            </div>

            <div id="modalHostSection" class="step-hidden">
                <div class="panel-title" style="margin-top: 6px;">1. 复制本端 Offer 发给对方</div>
                <textarea id="modalHostSdp" placeholder="生成中..." readonly></textarea>
                <button class="discord-btn discord-btn-secondary" id="modalCopyHost" style="margin-top: 6px;">复制 Offer</button>

                <div class="panel-title" style="margin-top: 10px;">2. 粘贴对方的 Answer 并建立连接</div>
                <textarea id="modalHostAnswer" placeholder="在此粘贴 Answer..."></textarea>
                <button class="discord-btn" id="modalApplyAnswer" style="margin-top: 6px;" disabled>验证并进入会议</button>
            </div>

            <div id="modalJoinSection">
                <div class="panel-title" style="margin-top: 6px;">1. 粘贴对方的 Offer</div>
                <textarea id="modalJoinOffer" placeholder="在此粘贴 Offer..."></textarea>
                <button class="discord-btn" id="modalApplyOffer" style="margin-top: 6px;" disabled>生成 Answer</button>

                <div class="panel-title" style="margin-top: 10px;">2. 复制生成的 Answer 发回给对方</div>
                <textarea id="modalJoinAnswer" placeholder="等待生成..." readonly></textarea>
                <button class="discord-btn discord-btn-secondary" id="modalCopyJoin" style="margin-top: 6px;" disabled>复制 Answer</button>
                <button class="discord-btn" id="modalFinishJoin" style="margin-top: 8px;" disabled>确认连通并进入会议</button>
            </div>
        </div>
    </div>

    <!-- 主界面布局 -->
    <div class="app-layout">
        <div class="app-header">
            <div class="app-title">
                <span>WebRTC Meeting</span>
                <div class="status-pill" id="status">就绪</div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="toggleControlsBtn" title="折叠/展开控件">
                    <svg viewBox="0 0 24 24"><path d="M12 8l-6 6 1.41 1.41L12 10.83l4.59 4.58L18 14z"/></svg>
                </button>
                <button class="icon-btn" id="toggleSidebarBtn" title="菜单与聊天">
                    <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
            </div>
        </div>

        <div class="main-workspace">
            <div class="stage-area">
                <div class="video-grid" id="videoGrid">
                    <div class="video-box" data-target="cam">
                        <div class="video-header">本地摄像头</div>
                        <div class="video-wrapper">
                            <video id="localCamVideo" autoplay muted playsinline></video>
                            <div class="video-overlay" id="localCamOverlay">摄像头已关闭</div>
                        </div>
                    </div>
                    <div class="video-box" data-target="screen">
                        <div class="video-header">本地屏幕</div>
                        <div class="video-wrapper">
                            <video id="localScreenVideo" autoplay muted playsinline></video>
                            <div class="video-overlay" id="localScreenOverlay">移动端暂不支持屏幕共享</div>
                        </div>
                    </div>
                    <div class="video-box" data-target="rcam">
                        <div class="video-header">远端摄像头</div>
                        <div class="video-wrapper">
                            <video id="remoteCamVideo" autoplay playsinline></video>
                            <div class="video-overlay" id="remoteCamOverlay">对方摄像头已关闭</div>
                        </div>
                    </div>
                    <div class="video-box" data-target="rscreen">
                        <div class="video-header">远端屏幕</div>
                        <div class="video-wrapper">
                            <video id="remoteScreenVideo" autoplay playsinline></video>
                            <div class="video-overlay" id="remoteScreenOverlay">对方屏幕未共享</div>
                        </div>
                    </div>
                </div>

                <div class="control-bar" id="controlBar">
                    <button class="control-btn" id="micBtn" title="麦克风">
                        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/></svg>
                    </button>
                    <button class="control-btn active" id="soundBtn" title="扬声器">
                        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                    </button>
                    <button class="control-btn" id="camBtn" title="摄像头">
                        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-3.5v-3.5l4 4v-11l-4 4z"/></svg>
                    </button>
                    <button class="control-btn" id="screenBtn" title="屏幕共享">
                        <svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.1-.9-2-2-2H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6z"/></svg>
                    </button>
                </div>
            </div>

            <div class="sidebar-panel mobile-hidden" id="sidebarPanel">
                <div class="chat-section">
                    <div class="panel-title">文字聊天</div>
                    <div class="chat-messages" id="chatMessages">
                        <div style="color: var(--discord-text-muted); text-align: center;">连接后聊天</div>
                    </div>
                    <div class="chat-input-row">
                        <input type="text" id="chatInput" placeholder="发消息..." disabled>
                        <button class="discord-btn" id="sendChatBtn" disabled style="width: auto; padding: 0 12px;">发送</button>
                    </div>
                </div>

                <div class="panel-section" style="padding-bottom: 14px;">
                    <div class="panel-title" style="margin-bottom: 4px;">日志</div>
                    <div class="log-box" id="log">准备就绪...</div>
                </div>
            </div>
        </div>
    </div>

   <script>
        const statusEl = document.getElementById('status');
        const initModal = document.getElementById('initModal');
        const modalHostBtn = document.getElementById('modalHostBtn');
        const modalJoinBtn = document.getElementById('modalJoinBtn');
        const modalHostSection = document.getElementById('modalHostSection');
        const modalJoinSection = document.getElementById('modalJoinSection');

        const modalHostSdp = document.getElementById('modalHostSdp');
        const modalCopyHost = document.getElementById('modalCopyHost');
        const modalHostAnswer = document.getElementById('modalHostAnswer');
        const modalApplyAnswer = document.getElementById('modalApplyAnswer');

        const modalJoinOffer = document.getElementById('modalJoinOffer');
        const modalApplyOffer = document.getElementById('modalApplyOffer');
        const modalJoinAnswer = document.getElementById('modalJoinAnswer');
        const modalCopyJoin = document.getElementById('modalCopyJoin');
        const modalFinishJoin = document.getElementById('modalFinishJoin');

        const micBtn = document.getElementById('micBtn');
        const soundBtn = document.getElementById('soundBtn');
        const camBtn = document.getElementById('camBtn');
        const screenBtn = document.getElementById('screenBtn');

        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendChatBtn = document.getElementById('sendChatBtn');

        const localCamVideo = document.getElementById('localCamVideo');
        const localScreenVideo = document.getElementById('localScreenVideo');
        const remoteCamVideo = document.getElementById('remoteCamVideo');
        const remoteScreenVideo = document.getElementById('remoteScreenVideo');

        const localCamOverlay = document.getElementById('localCamOverlay');
        const localScreenOverlay = document.getElementById('localScreenOverlay');
        const remoteCamOverlay = document.getElementById('remoteCamOverlay');
        const remoteScreenOverlay = document.getElementById('remoteScreenOverlay');

        const logEl = document.getElementById('log');

        const toggleControlsBtn = document.getElementById('toggleControlsBtn');
        const controlBar = document.getElementById('controlBar');
        const toggleSidebarBtn = document.getElementById('toggleSidebarBtn');
        const sidebarPanel = document.getElementById('sidebarPanel');
        const videoGrid = document.getElementById('videoGrid');

        let pc;
        let dataChannel;
        const ICE_SERVERS = { iceServers: [] };

        let micEnabled = false;
        let soundEnabled = true;
        let camEnabled = false;
        let screenEnabled = false;

        let micTrack = null;
        let camTrack = null;
        let screenTrack = null;

        let audioTransceiver = null;
        let videoTransceiver1 = null;
        let videoTransceiver2 = null;

        // 角色：'host' | 'join'
        let role = 'join';

        initJoinPeer();

        modalHostBtn.addEventListener('click', () => {
            modalHostBtn.classList.add('active');
            modalJoinBtn.classList.remove('active');
            modalHostSection.classList.remove('step-hidden');
            modalJoinSection.classList.add('step-hidden');
            role = 'host';
            resetPeer();
            initHostPeer();
        });

        modalJoinBtn.addEventListener('click', () => {
            modalJoinBtn.classList.add('active');
            modalHostBtn.classList.remove('active');
            modalJoinSection.classList.remove('step-hidden');
            modalHostSection.classList.add('step-hidden');
            role = 'join';
            resetPeer();
            initJoinPeer();
        });

        function resetPeer() {
            if (pc) {
                pc.close();
                pc = null;
            }
            dataChannel = null;
            audioTransceiver = null;
            videoTransceiver1 = null;
            videoTransceiver2 = null;
            remoteVideoCount = 0;
            modalHostSdp.value = '';
            modalJoinAnswer.value = '';
            modalCopyJoin.disabled = true;
            modalFinishJoin.disabled = true;
            modalApplyAnswer.disabled = true;
            modalApplyOffer.disabled = modalJoinOffer.value.trim().length <= 10;
        }

        document.querySelectorAll('.video-box').forEach(box => {
            box.addEventListener('click', () => {
                if (box.classList.contains('focused')) {
                    videoGrid.classList.remove('focused-mode');
                    box.classList.remove('focused');
                } else {
                    document.querySelectorAll('.video-box').forEach(b => b.classList.remove('focused'));
                    videoGrid.classList.add('focused-mode');
                    box.classList.add('focused');
                }
            });
        });

        let controlsExpanded = true;
        toggleControlsBtn.addEventListener('click', () => {
            controlsExpanded = !controlsExpanded;
            controlBar.classList.toggle('collapsed', !controlsExpanded);
            toggleControlsBtn.style.transform = controlsExpanded ? 'rotate(0deg)' : 'rotate(180deg)';
        });

        toggleSidebarBtn.addEventListener('click', () => {
            sidebarPanel.classList.toggle('mobile-hidden');
        });

        function log(msg) {
            console.log(msg);
            const timeStr = new Date().toLocaleTimeString();
            logEl.innerHTML += `<div>[${timeStr}] ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        micBtn.addEventListener('click', async () => {
            micEnabled = !micEnabled;
            if (micEnabled) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
                    });
                    micTrack = stream.getAudioTracks()[0];
                    if (audioTransceiver) await audioTransceiver.sender.replaceTrack(micTrack);
                    micBtn.classList.add('active');
                    log('麦克风已开启');
                } catch (e) {
                    micEnabled = false;
                    micBtn.classList.remove('active');
                    log('麦克风获取失败: ' + e.message);
                }
            } else {
                if (micTrack) {
                    micTrack.stop();
                    if (audioTransceiver) await audioTransceiver.sender.replaceTrack(null);
                    micTrack = null;
                }
                micBtn.classList.remove('active');
                log('麦克风已关闭');
            }
        });

        soundBtn.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            remoteCamVideo.muted = !soundEnabled;
            remoteScreenVideo.muted = !soundEnabled;
            const audioElem = document.getElementById('remoteAudioElem');
            if (audioElem) audioElem.muted = !soundEnabled;
            if (soundEnabled) {
                soundBtn.classList.add('active');
                log('扬声器已开启');
            } else {
                soundBtn.classList.remove('active');
                log('扬声器已静音');
            }
        });

        camBtn.addEventListener('click', async () => {
            camEnabled = !camEnabled;
            if (camEnabled) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({
                        video: { width: { ideal: 640 }, height: { ideal: 480 } }
                    });
                    camTrack = stream.getVideoTracks()[0];
                    localCamVideo.srcObject = new MediaStream([camTrack]);
                    localCamOverlay.classList.add('hidden');
                    if (videoTransceiver1) await videoTransceiver1.sender.replaceTrack(camTrack);
                    camBtn.classList.add('active');
                    log('摄像头已开启');
                    sendControlMessage({ type: 'video-state', target: 'cam', enabled: true });
                } catch (e) {
                    camEnabled = false;
                    camBtn.classList.remove('active');
                    localCamOverlay.textContent = '摄像头获取失败';
                    localCamOverlay.classList.remove('hidden');
                    log('摄像头获取失败: ' + e.message);
                }
            } else {
                if (camTrack) {
                    camTrack.stop();
                    if (videoTransceiver1) await videoTransceiver1.sender.replaceTrack(null);
                    camTrack = null;
                }
                localCamVideo.srcObject = null;
                localCamOverlay.textContent = '摄像头已关闭';
                localCamOverlay.classList.remove('hidden');
                camBtn.classList.remove('active');
                log('摄像头已关闭');
                sendControlMessage({ type: 'video-state', target: 'cam', enabled: false });
            }
        });

        screenBtn.addEventListener('click', async () => {
            if (!navigator.mediaDevices.getDisplayMedia) {
                alert('当前浏览器或手机系统不支持屏幕共享功能');
                return;
            }
            screenEnabled = !screenEnabled;
            if (screenEnabled) {
                try {
                    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
                    screenTrack = stream.getVideoTracks()[0];
                    screenTrack.onended = () => { if (screenEnabled) screenBtn.click(); };
                    localScreenVideo.srcObject = new MediaStream([screenTrack]);
                    localScreenOverlay.classList.add('hidden');
                    if (videoTransceiver2) await videoTransceiver2.sender.replaceTrack(screenTrack);
                    screenBtn.classList.add('active');
                    log('屏幕共享已开启');
                    sendControlMessage({ type: 'video-state', target: 'screen', enabled: true });
                } catch (e) {
                    screenEnabled = false;
                    screenBtn.classList.remove('active');
                    localScreenOverlay.textContent = '屏幕共享未开启/不支持';
                    localScreenOverlay.classList.remove('hidden');
                    log('屏幕共享已取消或被拒绝: ' + e.message);
                }
            } else {
                if (screenTrack) {
                    screenTrack.stop();
                    if (videoTransceiver2) await videoTransceiver2.sender.replaceTrack(null);
                    screenTrack = null;
                }
                localScreenVideo.srcObject = null;
                localScreenOverlay.textContent = '屏幕共享未开启';
                localScreenOverlay.classList.remove('hidden');
                screenBtn.classList.remove('active');
                log('屏幕共享已关闭');
                sendControlMessage({ type: 'video-state', target: 'screen', enabled: false });
            }
        });

        function sendControlMessage(msgObj) {
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify(msgObj));
            }
        }

        modalCopyHost.addEventListener('click', () => {
            navigator.clipboard.writeText(modalHostSdp.value).then(() => {
                modalCopyHost.textContent = '已复制';
                setTimeout(() => modalCopyHost.textContent = '复制 Offer', 2000);
            });
        });

        modalCopyJoin.addEventListener('click', () => {
            navigator.clipboard.writeText(modalJoinAnswer.value).then(() => {
                modalCopyJoin.textContent = '已复制';
                setTimeout(() => modalCopyJoin.textContent = '复制 Answer', 2000);
            });
        });

        modalHostAnswer.addEventListener('input', () => {
            modalApplyAnswer.disabled = modalHostAnswer.value.trim().length <= 10;
        });

        modalJoinOffer.addEventListener('input', () => {
            modalApplyOffer.disabled = modalJoinOffer.value.trim().length <= 10;
        });

        function setupDataChannelEvents() {
            dataChannel.onopen = () => {
                log('聊天通道已连通');
                chatInput.disabled = false;
                sendChatBtn.disabled = false;
            };
            dataChannel.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'video-state') {
                        if (data.target === 'cam') {
                            if (data.enabled) {
                                remoteCamOverlay.classList.add('hidden');
                            } else {
                                remoteCamOverlay.textContent = '对方摄像头已关闭';
                                remoteCamOverlay.classList.remove('hidden');
                            }
                        } else if (data.target === 'screen') {
                            if (data.enabled) {
                                remoteScreenOverlay.classList.add('hidden');
                            } else {
                                remoteScreenOverlay.textContent = '对方屏幕未共享';
                                remoteScreenOverlay.classList.remove('hidden');
                            }
                        }
                        return;
                    }
                } catch (e) {}
                appendMessage(event.data, 'remote');
            };
        }

        function appendMessage(text, type) {
            const div = document.createElement('div');
            div.className = `chat-msg ${type}`;
            div.textContent = (type === 'local' ? '我: ' : '对方: ') + text;
            chatMessages.appendChild(div);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendChatBtn.addEventListener('click', () => {
            const txt = chatInput.value.trim();
            if (!txt) return;
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(txt);
                appendMessage(txt, 'local');
                chatInput.value = '';
            } else {
                alert('聊天通道未就绪');
            }
        });
        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendChatBtn.click(); });

        let remoteVideoCount = 0;
        function handleIncomingTrack(event) {
            log('已捕获远端媒体轨道: ' + event.track.kind);
            statusEl.textContent = '通话中';

            let stream = event.streams[0];
            if (!stream) stream = new MediaStream([event.track]);

            if (event.track.kind === 'audio') {
                let audioElem = document.getElementById('remoteAudioElem');
                if (!audioElem) {
                    audioElem = document.createElement('audio');
                    audioElem.id = 'remoteAudioElem';
                    audioElem.autoplay = true;
                    audioElem.playsInline = true;
                    audioElem.muted = !soundEnabled;
                    document.body.appendChild(audioElem);
                }
                audioElem.srcObject = stream;
                audioElem.play().catch(() => {});
            } else if (event.track.kind === 'video') {
                if (remoteVideoCount === 0) {
                    remoteCamVideo.srcObject = stream;
                    remoteCamVideo.play().catch(() => {});
                    remoteCamOverlay.classList.add('hidden');
                    remoteVideoCount++;
                } else {
                    remoteScreenVideo.srcObject = stream;
                    remoteScreenVideo.play().catch(() => {});
                    remoteScreenOverlay.classList.add('hidden');
                }
            }
        }

        /** 创建端：主动 addTransceiver，保证 Offer 带双向能力 */
        function createHostPeerConnection() {
            pc = new RTCPeerConnection(ICE_SERVERS);

            audioTransceiver = pc.addTransceiver('audio', { direction: 'sendrecv' });
            videoTransceiver1 = pc.addTransceiver('video', { direction: 'sendrecv' });
            videoTransceiver2 = pc.addTransceiver('video', { direction: 'sendrecv' });

            if (micTrack && audioTransceiver) audioTransceiver.sender.replaceTrack(micTrack).catch(() => {});
            if (camTrack && videoTransceiver1) videoTransceiver1.sender.replaceTrack(camTrack).catch(() => {});
            if (screenTrack && videoTransceiver2) videoTransceiver2.sender.replaceTrack(screenTrack).catch(() => {});

            pc.ontrack = handleIncomingTrack;
        }

        /** 加入端：不要提前 addTransceiver，等 Offer 落地后再对齐 */
        function createJoinPeerConnection() {
            pc = new RTCPeerConnection(ICE_SERVERS);
            pc.ontrack = handleIncomingTrack;
            pc.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannelEvents();
            };
        }

        /**
         * 根据远端 Offer 产生的 transceiver 赋值，并强制 sendrecv，
         * 这样 Answer SDP 才会声明自己也能发音视频。
         */
        function bindJoinTransceivers() {
            audioTransceiver = null;
            videoTransceiver1 = null;
            videoTransceiver2 = null;

            const list = pc.getTransceivers();
            for (const t of list) {
                const kind = t.receiver && t.receiver.track ? t.receiver.track.kind : null;
                if (kind === 'audio' && !audioTransceiver) {
                    audioTransceiver = t;
                } else if (kind === 'video') {
                    if (!videoTransceiver1) videoTransceiver1 = t;
                    else if (!videoTransceiver2) videoTransceiver2 = t;
                }
            }

            // 强制双向，避免 Answer 变成 recvonly
            [audioTransceiver, videoTransceiver1, videoTransceiver2].forEach(t => {
                if (t && t.direction !== 'sendrecv') {
                    try { t.direction = 'sendrecv'; } catch (e) {}
                }
            });

            // 若用户已经开了麦/摄像头，立刻挂上
            if (micTrack && audioTransceiver) audioTransceiver.sender.replaceTrack(micTrack).catch(() => {});
            if (camTrack && videoTransceiver1) videoTransceiver1.sender.replaceTrack(camTrack).catch(() => {});
            if (screenTrack && videoTransceiver2) videoTransceiver2.sender.replaceTrack(screenTrack).catch(() => {});
        }

        async function initHostPeer() {
            createHostPeerConnection();
            dataChannel = pc.createDataChannel('chat');
            setupDataChannelEvents();

            let gathered = false;
            pc.onicecandidate = (event) => {
                if (!event.candidate && !gathered) {
                    gathered = true;
                    modalHostSdp.value = JSON.stringify(pc.localDescription);
                    log('Host Offer 收集完成');
                }
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            setTimeout(() => {
                if (!modalHostSdp.value) {
                    modalHostSdp.value = JSON.stringify(pc.localDescription);
                    log('Host Offer 已就绪');
                }
            }, 1200);
        }

        modalApplyAnswer.addEventListener('click', async () => {
            try {
                const answerDesc = JSON.parse(modalHostAnswer.value.trim());
                await pc.setRemoteDescription(new RTCSessionDescription(answerDesc));
                log('Answer 加载成功，正在建立 P2P 直连...');
                initModal.style.display = 'none';
            } catch (err) {
                alert('应用 Answer 失败: ' + err.message);
            }
        });

        function initJoinPeer() {
            createJoinPeerConnection();
        }

        modalApplyOffer.addEventListener('click', async () => {
            try {
                if (!pc) createJoinPeerConnection();

                const offerDesc = JSON.parse(modalJoinOffer.value.trim());
                await pc.setRemoteDescription(new RTCSessionDescription(offerDesc));

                // 关键：在 createAnswer 之前绑定 transceiver 并设为 sendrecv
                bindJoinTransceivers();

                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);

                let gathered = false;
                pc.onicecandidate = (event) => {
                    if (!event.candidate && !gathered) {
                        gathered = true;
                        modalJoinAnswer.value = JSON.stringify(pc.localDescription);
                        modalCopyJoin.disabled = false;
                        modalFinishJoin.disabled = false;
                        log('Answer 收集完成，可复制发回');
                    }
                };

                setTimeout(() => {
                    if (!modalJoinAnswer.value) {
                        modalJoinAnswer.value = JSON.stringify(pc.localDescription);
                        modalCopyJoin.disabled = false;
                        modalFinishJoin.disabled = false;
                        log('Answer 已就绪');
                    }
                }, 1200);
            } catch (err) {
                alert('解析 Offer 失败: ' + err.message);
            }
        });

        modalFinishJoin.addEventListener('click', () => {
            initModal.style.display = 'none';
            log('已确认连通，进入会议');
        });
</script>
</body>
</html>
